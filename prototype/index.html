<title>QREASY V2 Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header; generator = form | live preview | ad rail (stacks on phones); CMS = tab rail | content */
:root {
  --bg: #f3f5fa;
  --surface: #ffffff;
  --surface-2: #eaeef7;
  --line: #d5dbe9;
  --fg: #101a30;
  --muted: #55607b;
  --accent: #2741cc;
  --accent-ink: #ffffff;
  --accent-soft: #e2e7fc;
  --ok: #1b6f45;
  --ok-soft: #dcf1e5;
  --warn: #8f5300;
  --warn-soft: #fbeed6;
  --bad: #ab2238;
  --bad-soft: #fbe1e6;
  --hatch: rgba(39, 65, 204, 0.08);
  --checker: #e6eaf3;
  --shadow: 0 1px 2px rgba(16, 26, 48, 0.06), 0 8px 24px rgba(16, 26, 48, 0.06);
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1220; --surface: #141a2c; --surface-2: #1a2238; --line: #2a3452; --fg: #e6eaf5; --muted: #98a3c2;
    --accent: #8d9fff; --accent-ink: #0d1220; --accent-soft: #222b52;
    --ok: #63d39b; --ok-soft: #12301f; --warn: #f0b45a; --warn-soft: #33260f; --bad: #ff8a9b; --bad-soft: #3a1820;
    --hatch: rgba(141, 159, 255, 0.09); --checker: #1f2740; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1220; --surface: #141a2c; --surface-2: #1a2238; --line: #2a3452; --fg: #e6eaf5; --muted: #98a3c2;
  --accent: #8d9fff; --accent-ink: #0d1220; --accent-soft: #222b52;
  --ok: #63d39b; --ok-soft: #12301f; --warn: #f0b45a; --warn-soft: #33260f; --bad: #ff8a9b; --bad-soft: #3a1820;
  --hatch: rgba(141, 159, 255, 0.09); --checker: #1f2740; --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.2rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
.mono { font-family: var(--f-mono); }
.small { font-size: 0.82rem; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 24px 56px; }

/* prototype strip */
.proto { background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); }
.proto-in { max-width: 1320px; margin: 0 auto; padding-block: 6px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
.proto b { color: var(--fg); font-family: var(--f-mono); font-weight: 500; letter-spacing: 0.06em; }
.proto code { font-family: var(--f-mono); color: var(--fg); }

/* header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.hdr-in { max-width: 1320px; margin: 0 auto; padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); }
.glyph { width: 22px; height: 22px; border: 3px solid var(--fg); border-radius: 3px; position: relative; flex: none; }
.glyph::after { content: ""; position: absolute; inset: 3px; background: var(--accent); border-radius: 1px; }
.brand-t { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; letter-spacing: 0.04em; }
.brand-t span { color: var(--accent); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav-a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-weight: 500; }
.nav-a:hover { color: var(--fg); background: var(--surface-2); }
.nav-a.on { color: var(--accent); background: var(--accent-soft); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.who { font-weight: 500; max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-weight: 500; padding: 9px 16px; border-radius: 8px; cursor: pointer; text-decoration: none; transition: background 0.15s, border-color 0.15s; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.sm { padding: 6px 12px; font-size: 0.88rem; }
.btn-text { background: none; border: 0; font: inherit; color: var(--muted); cursor: pointer; padding: 6px 8px; border-radius: 6px; }
.btn-text:hover { color: var(--fg); background: var(--surface-2); }
.link-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; }

label { font-weight: 500; font-size: 0.9rem; }
input[type="text"], input[type="url"], input[type="email"], input[type="password"], input[type="tel"], input:not([type]), select, textarea {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px;
}
textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 400; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.req::after { content: " *"; color: var(--bad); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.h-sec { font-size: 1rem; font-weight: 600; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

/* generator */
.gen { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .gen { grid-template-columns: minmax(0, 1fr) 360px; } }
@media (min-width: 1200px) { .gen { grid-template-columns: minmax(0, 1fr) 360px 300px; } }
.gen-main, .gen-preview { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.intro { display: flex; flex-direction: column; gap: 6px; }
.lede { color: var(--muted); max-width: 60ch; }
.types { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-weight: 500; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.fields { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .fields.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fields .wide { grid-column: 1 / -1; } }
.grid-custom { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); margin-top: 14px; }
.color { display: flex; gap: 8px; }
.color input[type="color"] { width: 44px; height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface); flex: none; cursor: pointer; }
.color input:not([type="color"]) { font-family: var(--f-mono); text-transform: uppercase; }
.logo-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.logo-row input[type="file"] { font: inherit; font-size: 0.85rem; max-width: 100%; }
.note { font-size: 0.82rem; color: var(--muted); }

.preview { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
.checker { position: relative; display: grid; place-items: center; padding: 16px; border-radius: 8px; background: repeating-conic-gradient(var(--checker) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; min-height: 280px; }
#qr { width: 100%; max-width: 280px; transition: opacity 0.2s; }
#qr svg, #qr canvas { display: block; width: 100%; height: auto; }
#qr.dim { opacity: 0.18; }
.qr-err { position: absolute; inset: auto 16px 16px; background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 10px 12px; font-size: 0.88rem; font-weight: 500; }
.payload { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.payload dt { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.payload dd { margin: 0; min-width: 0; }
.payload code { display: block; font-family: var(--f-mono); font-size: 0.8rem; background: var(--surface-2); padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; max-height: 7.5em; overflow: auto; }
.warns { display: flex; flex-direction: column; gap: 8px; }
.warns:empty { display: none; }
.alert { border-radius: 8px; padding: 8px 12px; font-size: 0.86rem; border-left: 3px solid; }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.info { background: var(--accent-soft); color: var(--accent); }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert.ok { background: var(--ok-soft); color: var(--ok); }
.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.save { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 14px; }
.row { display: flex; gap: 8px; }
.row > input { flex: 1; min-width: 0; }

/* affiliate */
.aff { display: flex; flex-direction: column; gap: 12px; }
.aff-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.aff-grid { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.aff-card { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "plat cta" "name name" "price price"; gap: 2px 8px; text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.aff-card:hover { border-color: var(--accent); }
.aff-plat { grid-area: plat; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.aff-cta { grid-area: cta; font-size: 0.82rem; color: var(--accent); font-weight: 500; }
.aff-name { grid-area: name; font-weight: 500; }
.aff-price { grid-area: price; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ad placeholders */
.ad { position: relative; border: 1px dashed var(--line); border-radius: 8px; background: repeating-linear-gradient(45deg, var(--hatch) 0 8px, transparent 8px 16px); display: grid; place-items: center; text-align: center; padding: 28px 12px 16px; color: var(--muted); }
.ad-label { position: absolute; top: 6px; left: 8px; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.ad-body { display: flex; flex-direction: column; gap: 2px; font-size: 0.82rem; }
.ad-body strong { color: var(--fg); font-weight: 500; }
.ad-generator_side { height: 600px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); }
.ad-generator_below { min-height: 250px; }
.gen-rail { display: none; }
@media (min-width: 1200px) { .gen-rail { display: block; } .ad-generator_below { display: none; } }
.anchor { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.anchor .ad { height: 58px; padding: 6px 40px; margin-block: 6px; }
.anchor .ad-body { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 2px 10px; }
.anchor-x { position: absolute; top: -14px; right: max(12px, env(safe-area-inset-right, 0px)); width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; font: inherit; line-height: 1; }
@media (min-width: 768px) { .anchor { display: none; } }
@media (max-width: 767px) { body.has-anchor { padding-bottom: 80px; } }

/* auth */
.narrow { max-width: 440px; }
.auth { display: flex; flex-direction: column; gap: 16px; }
.auth form { display: flex; flex-direction: column; gap: 14px; }
.oauth { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.85rem; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.code-input { font-family: var(--f-mono) !important; font-size: 1.4rem !important; letter-spacing: 0.4em; text-align: center; }

/* account */
.acc { display: flex; flex-direction: column; gap: 28px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.qr-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.qr-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.mini { background: repeating-conic-gradient(var(--checker) 0 25%, var(--surface) 0 50%) 0 0 / 12px 12px; border-radius: 6px; padding: 10px; display: grid; place-items: center; }
.mini > div { width: 120px; }
.mini svg { display: block; width: 100%; height: auto; }
.qr-card h3 { font-size: 1rem; font-weight: 600; overflow-wrap: anywhere; }
.qr-card .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 28px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.two-col { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .two-col { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* admin */
.admin { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .admin { grid-template-columns: 200px minmax(0, 1fr); } }
.admin-nav { display: flex; gap: 4px; overflow-x: auto; }
@media (min-width: 900px) { .admin-nav { flex-direction: column; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); align-self: start; } }
.admin-nav a { white-space: nowrap; text-decoration: none; color: var(--muted); padding: 8px 12px; border-radius: 8px; font-weight: 500; }
.admin-nav a:hover { background: var(--surface-2); color: var(--fg); }
.admin-nav a.on { background: var(--fg); color: var(--bg); }
.admin-body { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.admin-title { display: flex; flex-direction: column; gap: 4px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.filters .field { flex: 1 1 180px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.open > td { background: var(--accent-soft); }
tr.detail > td { background: var(--surface-2); padding: 16px; }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.detail-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .detail-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 0.88rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.act-block { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.act-block:last-child { border-bottom: 0; padding-bottom: 0; }
.err { color: var(--bad); font-size: 0.82rem; }
.form-grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.bar { display: grid; grid-template-columns: 7ch 1fr 4ch; gap: 10px; align-items: center; font-size: 0.88rem; }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
.switch { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; }
.switch input { width: 40px; height: 22px; appearance: none; background: var(--line); border-radius: 999px; position: relative; cursor: pointer; transition: background 0.15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform 0.15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }

/* footer, consent, toast */
.foot { border-top: 1px solid var(--line); background: var(--surface); }
.foot-in { max-width: 1320px; margin: 0 auto; padding-block: 20px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.foot-in .sp { margin-left: auto; }
.consent { position: fixed; z-index: 20; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 560px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.consent .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.toasts { position: fixed; z-index: 30; top: calc(env(safe-area-inset-top, 0px) + 70px); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 24px)); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; box-shadow: var(--shadow); animation: tin 0.2s ease-out; }
.toast.bad { background: var(--bad); color: #ffffff; }
@keyframes tin { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>

<div class="proto gutter" id="proto"></div>
<header class="hdr gutter" id="hdr"></header>
<main class="gutter" id="app"></main>
<footer class="foot gutter" id="foot"></footer>
<div id="consent"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- storage (prototype only: everything lives in this browser) ---------- */
  const mem = {};
  const store = {
    get(k, d) {
      try { const v = localStorage.getItem(k); if (v !== null) return JSON.parse(v); } catch (e) {}
      return k in mem ? mem[k] : d;
    },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },

      return { ok: true, payload: f.text };

  let lastValid = null, timer = null;
  function schedule() { clearTimeout(timer); timer = setTimeout(updatePreview, 180); keepGen(); }
  function setActions(on) { $$('[data-needs-valid]').forEach(b => { b.disabled = !on; }); }
  function updatePreview() {
    const host = $('#qr'); if (!host) return;
    const res = buildPayload(gen.type, gen.fields), s = gen.style, ec = s.logo ? 'H' : s.ec;
    let error = res.ok ? null : res.error;
    $('#payloadOut').textContent = res.ok ? res.payload : '—';
    if (res.ok) {
      const bytes = new TextEncoder().encode(res.payload).length;
      $('#bytes').textContent = bytes.toLocaleString() + ' / ' + CAP[ec].toLocaleString() + ' bytes · EC ' + ec;
      if (bytes > CAP[ec]) error = L('ข้อมูลยาวเกินกว่าที่ QR ระดับ ' + ec + ' รองรับ ลดความยาว หรือเลือกระดับการแก้ไขข้อผิดพลาดที่ต่ำลง', 'Too much data for level ' + ec + '. Shorten it or choose a lower error correction level.');
    } else $('#bytes').textContent = '';
    const w = [];
    if (res.ok && res.note) w.push(['info', res.note]);
    if (s.transparent) w.push(['info', L('พื้นหลังโปร่งใส: วาง QR บนพื้นสีอ่อนเพื่อให้สแกนได้', 'Transparent background: place the QR on a light surface so it scans')]);
    else {
      const lf = lum(s.fg), lb = lum(s.bg), ratio = (Math.max(lf, lb) + 0.05) / (Math.min(lf, lb) + 0.05);
      if (lf > lb) w.push(['warn', L('สีจุดอ่อนกว่าพื้นหลัง (กลับสี) แอปสแกนบางตัวอ่านไม่ได้', 'Dots are lighter than the background. Some scanner apps cannot read inverted codes.')]);
      if (ratio < 4) w.push(['warn', L('สีจุดกับพื้นหลังต่างกันน้อย (' + ratio.toFixed(1) + ':1) ควรมากกว่า 4:1 เพื่อให้สแกนง่าย', 'Low contrast (' + ratio.toFixed(1) + ':1). Use at least 4:1 so it scans reliably.')]);
    }
    if (gen.type === 'wifi' && gen.fields.wifiPass) w.push(['info', L('รหัสผ่าน Wi-Fi อยู่ใน QR ใครสแกนก็เห็น', 'The Wi-Fi password is inside the QR. Anyone who scans it can see it.')]);
    $('#warnings').innerHTML = w.map(x => '<div class="alert ' + x[0] + '">' + esc(x[1]) + '</div>').join('');
    const err = $('#qrErr');
    if (error) { err.hidden = false; err.textContent = error; host.classList.add('dim'); setActions(false); lastValid = null; return; }
    if (!libReady()) { err.hidden = false; err.textContent = L('โหลดตัวสร้าง QR ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้า', 'The QR library did not load. Check your connection and reload.'); setActions(false); return; }
    err.hidden = true; host.classList.remove('dim'); setActions(true);
    lastValid = res.payload;
    host.innerHTML = '';
    try { new window.QRCodeStyling(qrOptions(res.payload, s, 300)).append(host); } catch (e) { err.hidden = false; err.textContent = String(e.message || e); }
    if (!state.generatedOnce) { state.generatedOnce = true; track('qr_generate', { type: gen.type }); }
  }

  async function exportBlob(fmt) {
    const inst = new window.QRCodeStyling(qrOptions(lastValid, gen.style, fmt === 'svg' ? 1024 : Number(gen.style.size), fmt === 'svg' ? 'svg' : 'canvas'));
    return inst.getRawData(fmt);
  }
  async function download(fmt) {
    if (!lastValid || !libReady()) return;
    try {
      const blob = await exportBlob(fmt);
      if (!blob) throw new Error('empty');
      const name = 'qreasy-' + gen.type + '-' + stamp() + '.' + fmt;
      const viewer = window.claude && typeof window.claude.use === 'function';
      if (viewer) {
        // Inside the claude.ai viewer: files go through the downloads capability
        const dl = await window.claude.use('downloads');
        if (!dl) return toast(L('หน้านี้ดาวน์โหลดไฟล์ไม่ได้ เปิด prototype/index.html ในเครื่องแทน', 'Downloads are not available here. Open prototype/index.html locally instead.'), 'bad');
        try { await dl.save({ filename: name, data: blob }); }
        catch (err) {
          if (err && err.code === 'declined') return;
          if (err && err.code === 'rate_limited') return toast(L('มีหน้าต่างบันทึกไฟล์เปิดอยู่แล้ว', 'A save prompt is already open'), 'bad');
          return toast(L('บันทึกไฟล์ไม่สำเร็จ', 'The file was not saved'), 'bad');
        }
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }
      db.counters[fmt] = (db.counters[fmt] || 0) + 1; persist();
      track('qr_download', { type: gen.type, format: fmt, is_member: !!currentUser() });
      toast(L('สร้างไฟล์ ' + name + ' แล้ว', 'Created ' + name));
    } catch (e) { toast(L('สร้างไฟล์ไม่สำเร็จ ลองอีกครั้ง', 'Could not create the file. Try again.'), 'bad'); }
  }
  function copyImage() {
    if (!lastValid || !libReady()) return;
    try {
      if (!navigator.clipboard || !window.ClipboardItem) throw new Error('unsupported');
      const p = exportBlob('png');
      navigator.clipboard.write([new ClipboardItem({ 'image/png': p })]).then(() => {
        db.counters.copy++; persist(); track('qr_copy', { type: gen.type });
        toast(L('คัดลอกภาพ QR แล้ว', 'QR image copied'));
      }).catch(() => toast(L('เบราว์เซอร์นี้ไม่อนุญาตให้คัดลอกภาพ ใช้ปุ่ม PNG แทน', 'This browser blocked copying images. Use PNG instead.'), 'bad'));
    } catch (e) { toast(L('เบราว์เซอร์นี้คัดลอกภาพไม่ได้ ใช้ปุ่ม PNG แทน', 'This browser cannot copy images. Use PNG instead.'), 'bad'); }
  }
  function saveQr() {
    const u = currentUser();
    if (!u) {
      state.pendingSave = true; keepGen();
      state.authMsg = { kind: 'info', text: L('Login หรือสมัครสมาชิกเพื่อบันทึก QR Code นี้ ข้อมูลที่กรอกไว้ยังอยู่ครบ', 'Log in or sign up to save this QR Code. What you entered is kept.') };
      return go('login');
    }
    if (!lastValid) return;
    const fields = clone(gen.fields);
    if (gen.type === 'wifi' && gen.skipWifiPass) fields.wifiPass = '';
    const name = (gen.name || '').trim() || (typeLabel(gen.type) + ' ' + fmtDate(Date.now()));
    const existing = gen.editId && db.qrs.find(q => q.id === gen.editId && q.userId === u.id);
    if (existing) {
      Object.assign(existing, { name, type: gen.type, fields, style: clone(gen.style), updatedAt: Date.now() });
    } else {
      if (db.qrs.filter(q => q.userId === u.id).length >= db.settings.maxSaved) return toast(L('บันทึกครบ ' + db.settings.maxSaved + ' รายการแล้ว ลบรายการเก่าก่อน', 'You have reached ' + db.settings.maxSaved + ' saved codes. Delete one first.'), 'bad');
      const q = { id: uid('q'), userId: u.id, name, type: gen.type, fields, style: clone(gen.style), createdAt: Date.now(), updatedAt: Date.now() };
      db.qrs.unshift(q); gen.editId = q.id;
    }
    gen.name = name; persist(); keepGen();

  function readLogo(file) {
    if (!file) return;
    if (['image/png', 'image/jpeg', 'image/svg+xml'].indexOf(file.type) < 0) return toast(L('รองรับเฉพาะไฟล์ PNG, JPEG หรือ SVG', 'Use a PNG, JPEG or SVG file'), 'bad');
    if (file.size > 2 * 1024 * 1024) return toast(L('ไฟล์ใหญ่เกิน 2 MB', 'The file is larger than 2 MB'), 'bad');
    const r = new FileReader();
    const done = url => { gen.style.logo = url; gen.style.logoName = file.name; $('#custom').innerHTML = renderCustom(); schedule(); track('qr_customize', { option: 'logo' }); };
    if (file.type === 'image/svg+xml') {
      r.onload = () => {
        const txt = String(r.result);
        if (/<script|\son\w+\s*=|javascript:/i.test(txt)) return toast(L('ไฟล์ SVG นี้มีสคริปต์ จึงใช้ไม่ได้', 'This SVG contains scripts, so it cannot be used'), 'bad');
        done('data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(txt))));
      };
      r.readAsText(file);
    } else { r.onload = () => done(r.result); r.readAsDataURL(file); }
  }

  /* ---------- render ---------- */
  let lastRoute = null;
  function render() {
    const r = route();
    applyTheme(); renderProto(); renderHeader(); renderFooter(); renderConsent();
    document.body.classList.remove('has-anchor');
    const u = currentUser();
    let html;
    if (r.indexOf('admin') === 0) {
      if (!u) { state.authMsg = { kind: 'info', text: L('Login ด้วยบัญชีผู้ดูแลเพื่อเข้า CMS', 'Log in with an admin account to open the CMS') }; return go('login'); }
      if (!isAdminRole(u)) html = viewDenied();
      else if (!session.twoFA) return go('verify2fa');
      else html = viewAdmin(r);
    } else if (r === 'login') html = viewLogin();
    else if (r === 'register') html = viewRegister();
    else if (r === 'verify2fa') { if (!u || !isAdminRole(u)) return go('home'); if (session.twoFA) return go('admin'); html = view2fa(); }
    else if (r === 'account') { if (!u) { state.authMsg = { kind: 'info', text: L('Login เพื่อดู QR ของคุณ', 'Log in to see your QR codes') }; return go('login'); } html = viewAccount(); }
    else html = viewHome();
    $('#app').innerHTML = html;
    if (r !== lastRoute) { window.scrollTo(0, 0); lastRoute = r; }
    if (r === 'home' || ['login', 'register', 'verify2fa', 'account'].indexOf(r) < 0 && r.indexOf('admin') !== 0) updatePreview();
    if (r === 'account') drawMinis();
  }
  window.addEventListener('hashchange', render);

  /* ---------- events ---------- */
  const actions = {
    lang() { state.lang = state.lang === 'th' ? 'en' : 'th'; store.set('qe_lang', state.lang); track('language_switch', { to: state.lang }); render(); },
    theme() { state.theme = { system: 'light', light: 'dark', dark: 'system' }[state.theme]; store.set('qe_theme', state.theme); render(); },
    logout() { session = null; store.del('qe_session'); gen.editId = null; keepGen(); go('home'); toast(L('ออกจากระบบแล้ว', 'Logged out')); },
    reset() {
      if (!state.resetArmed) { state.resetArmed = true; renderProto(); setTimeout(() => { state.resetArmed = false; renderProto(); }, 4000); return; }
      state.resetArmed = false; db = seed(); persist(); session = null; store.del('qe_session'); gen = defaultGen(); keepGen();
      state.consent = null; store.del('qe_consent'); go('home'); toast(L('รีเซ็ตข้อมูลตัวอย่างแล้ว', 'Sample data reset'));
    },
    stub() { toast(L('หน้าเนื้อหานี้จะทำในระบบจริง', 'This content page comes in the real build')); },
    consentOpen() { state.consentOpen = true; renderConsent(); },
    consent(b) { state.consent = b.dataset.v; state.consentOpen = false; store.set('qe_consent', state.consent); render(); toast(state.consent === 'all' ? L('ยอมรับคุกกี้ทั้งหมดแล้ว', 'All cookies accepted') : L('ใช้เฉพาะคุกกี้ที่จำเป็น', 'Using necessary cookies only')); },
    closeAnchor() { state.anchorClosed = true; const a = $('.anchor'); if (a) a.remove(); document.body.classList.remove('has-anchor'); },
    type(b) {
      gen.type = b.dataset.type; keepGen();
      $$('.types .chip').forEach(c => { const on = c.dataset.type === gen.type; c.classList.toggle('on', on); c.setAttribute('aria-selected', on); });
      $('#fields').innerHTML = renderFields(); $('#aff').outerHTML = affiliateBlock(); $('#saveBox').innerHTML = saveBlock();
      track('qr_type_select', { type: gen.type }); updatePreview();
    },
    dl(b) { download(b.dataset.fmt); },
    copy() { copyImage(); },
    saveQr() { saveQr(); },
    newQr() { gen = defaultGen(); keepGen(); render(); },
    logoRemove() { gen.style.logo = null; gen.style.logoName = ''; $('#custom').innerHTML = renderCustom(); schedule(); },
    aff(a) { const it = db.affiliates.find(x => x.id === a.dataset.id); if (it) { it.clicks++; persist(); track('affiliate_click', { product_id: it.id, platform: it.platform, placement: 'generator', qr_type: gen.type }); } return true; },
    oauth(b) {
      const p = b.dataset.p, email = p + '.demo@example.com';
      let u = db.users.find(x => x.email === email);
      if (!u) { u = { id: uid('u'), name: p === 'google' ? 'Google Demo' : 'LINE Demo', email, password: '', role: 'member', status: 'active', provider: p, verified: true, createdAt: Date.now(), lastLogin: Date.now(), reason: '' }; db.users.push(u); persist(); track('sign_up', { method: p }); }
      if (u.status !== 'active') { state.authMsg = { kind: 'bad', text: L('บัญชีนี้ถูกระงับ', 'This account is suspended') }; return render(); }
      toast(L('Login ด้วย ' + (p === 'google' ? 'Google' : 'LINE') + ' (จำลอง)', 'Logged in with ' + (p === 'google' ? 'Google' : 'LINE') + ' (simulated)'));
      loginAs(u, p);
    },
    forgot() { state.forgotOpen = true; state.forgotSent = false; render(); },
    verifyEmail() {
      const u = db.users.find(x => x.email === state.regPending); state.regPending = null;
      if (!u) return go('register');
      u.verified = true; persist(); track('sign_up', { method: 'email' });
      toast(L('ยืนยันอีเมลแล้ว ยินดีต้อนรับ', 'Email confirmed. Welcome!')); loginAs(u, 'email');
    },
    qrOpen(b) { const q = db.qrs.find(x => x.id === b.dataset.id); if (!q) return; gen = { type: q.type, fields: clone(q.fields), style: clone(q.style), name: q.name, skipWifiPass: false, editId: q.id }; keepGen(); go('home'); },
    qrAsk(b) { state.confirmQr = b.dataset.id; render(); },
    qrCancel() { state.confirmQr = null; render(); },
    qrDelete(b) { db.qrs = db.qrs.filter(q => q.id !== b.dataset.id); if (gen.editId === b.dataset.id) gen.editId = null; state.confirmQr = null; persist(); render(); toast(L('ลบแล้ว', 'Deleted')); },
    exportMe() { toast(L('ระบบจริงจะส่งลิงก์ดาวน์โหลดไฟล์ JSON ที่ใช้ได้ 24 ชั่วโมง', 'The real system emails a JSON download link that works for 24 hours')); },
    uOpen(b) { state.userOpen = state.userOpen === b.dataset.id ? null : b.dataset.id; $('#userTable').innerHTML = userTable(); },
    uSuspend(b) {
      const u = db.users.find(x => x.id === b.dataset.id), reason = $('#rs-' + u.id).value.trim();
      if (!reason) { $('#rs-err-' + u.id).textContent = L('ระบุเหตุผลก่อนระงับ', 'Add a reason first'); return; }
      u.status = 'suspended'; u.reason = reason; persist(); audit('user.suspend', u.email, reason); $('#userTable').innerHTML = userTable(); toast(L('ระงับบัญชีและ Logout ทุกอุปกรณ์แล้ว', 'Account suspended and logged out everywhere'));
    },
    uUnsuspend(b) { const u = db.users.find(x => x.id === b.dataset.id); u.status = 'active'; u.reason = ''; persist(); audit('user.unsuspend', u.email, ''); $('#userTable').innerHTML = userTable(); toast(L('ยกเลิกการระงับแล้ว', 'Suspension lifted')); },
    uRevoke(b) { const u = db.users.find(x => x.id === b.dataset.id); audit('user.revoke_sessions', u.email, ''); toast(L('Logout ทุกอุปกรณ์ของ ' + u.email + ' แล้ว', 'Logged ' + u.email + ' out everywhere')); },
    uMail(b) { const u = db.users.find(x => x.id === b.dataset.id), k = b.dataset.kind; audit(k === 'verify' ? 'user.resend_verification' : 'user.send_reset', u.email, ''); toast(L('ส่งอีเมลไปที่ ' + u.email + ' แล้ว (จำลอง)', 'Email sent to ' + u.email + ' (simulated)')); },
    uRole(b) {
      const me = currentUser(), u = db.users.find(x => x.id === b.dataset.id), v = $('#rl-' + u.id).value;
      if (me.role !== 'super_admin' || v === u.role) return;

    },
    uDelete(b) {
      const u = db.users.find(x => x.id === b.dataset.id), typed = $('#dl-' + u.id).value.trim().toLowerCase();
      if (typed !== u.email.toLowerCase()) { $('#dl-err-' + u.id).textContent = L('อีเมลไม่ตรง จึงยังไม่ลบ', 'The email does not match, so nothing was deleted'); return; }
      db.users = db.users.filter(x => x.id !== u.id); db.qrs = db.qrs.filter(q => q.userId !== u.id); state.userOpen = null; persist(); audit('user.delete', u.email, ''); $('#userTable').innerHTML = userTable(); toast(L('ลบบัญชีแล้ว', 'Account deleted'));
    }
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.act];
    if (!fn) return;
    const keepDefault = fn(el, e) === true;
    if (!keepDefault && el.tagName !== 'A') e.preventDefault();
  });

  function onField(e) {
    const el = e.target;
    if (el.dataset.f) { gen.fields[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; schedule(); return; }
    if (el.dataset.s) {
      const s = gen.style, k = el.dataset.s;
      if (k === 'fg' || k === 'bg') { s[k] = el.value; const hx = $('#c-' + k + 'Hex'); if (hx) hx.value = el.value; }
      else if (k === 'fgHex' || k === 'bgHex') { const key = k.slice(0, 2); if (/^#[0-9a-f]{6}$/i.test(el.value)) { s[key] = el.value.toLowerCase(); $('#c-' + key).value = s[key]; } else return; }
      else if (k === 'transparent') { s.transparent = el.checked; $('#c-bg').disabled = el.checked; $('#c-bgHex').disabled = el.checked; }
      else s[k] = k === 'size' ? Number(el.value) : el.value;
      if (e.type === 'change') track('qr_customize', { option: k.replace('Hex', '') });
      schedule(); return;
    }
    if (el.id === 'saveName') { gen.name = el.value; keepGen(); return; }
    if (el.id === 'skipWifi') { gen.skipWifiPass = el.checked; keepGen(); return; }
    if (el.id === 'c-logo' && e.type === 'change') { readLogo(el.files && el.files[0]); el.value = ''; return; }
    if (el.dataset.uf) { state[el.dataset.uf] = el.value; $('#userTable').innerHTML = userTable(); return; }
    if (el.dataset.affToggle && e.type === 'change') {
      const a = db.affiliates.find(x => x.id === el.dataset.affToggle); a.enabled = el.checked; persist();
      audit('affiliate.toggle', a.nameEn, a.enabled ? 'on' : 'off'); toast(a.enabled ? L('เปิดแสดงสินค้าแล้ว', 'Product shown') : L('ซ่อนสินค้าแล้ว', 'Product hidden'));
    }
  }
  document.addEventListener('input', onField);
  document.addEventListener('change', e => { const el = e.target; if (el.dataset.f && el.type !== 'checkbox' && el.tagName !== 'SELECT') return; onField(e); });

  const forms = {
    login() {
      const email = $('#li-email').value.trim().toLowerCase(), pass = $('#li-pass').value;
      const fails = state.loginFails[email] || 0;
      if (fails >= 5) { state.authMsg = { kind: 'bad', text: L('Login ผิดเกิน 5 ครั้ง ลองใหม่ใน 15 นาที หรือกด "ลืมรหัสผ่าน"', 'Too many failed attempts. Try again in 15 minutes or reset your password.') }; return render(); }
      const u = db.users.find(x => x.email.toLowerCase() === email);
      if (!u || u.password !== pass) { state.loginFails[email] = fails + 1; state.authMsg = { kind: 'bad', text: L('อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'The email or password is incorrect') }; return render(); }
      if (u.status !== 'active') { state.authMsg = { kind: 'bad', text: L('บัญชีนี้ถูกระงับ: ' + u.reason + ' ติดต่อเราผ่านหน้า "ติดต่อเรา" ถ้าคิดว่าเป็นความผิดพลาด', 'This account is suspended: ' + u.reason + '. Contact us if you think this is a mistake.') }; return render(); }
      if (!u.verified) { state.regPending = u.email; return go('register'); }
      state.loginFails[email] = 0;
      loginAs(u, 'email');
    },
    forgot() { state.forgotSent = true; render(); },
    register() {
      const name = $('#rg-name').value.trim(), email = $('#rg-email').value.trim().toLowerCase(), pass = $('#rg-pass').value;
      let m = null;
      if (!name) m = L('กรอกชื่อที่แสดง', 'Enter a display name');
      else if (!EMAIL_RE.test(email)) m = L('กรอกอีเมลให้ถูกต้อง', 'Enter a valid email');
      else if (pass.length < 8) m = L('รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร', 'The password needs at least 8 characters');
      else if (['password', '12345678', 'password123', 'qwertyui'].indexOf(pass.toLowerCase()) >= 0) m = L('รหัสผ่านนี้เคยรั่วไหลและเดาง่าย เลือกรหัสอื่น', 'This password appears in known leaks. Choose another one.');
      else if (!$('#rg-terms').checked) m = L('ต้องยอมรับข้อกำหนดและนโยบายก่อนสมัคร', 'Accept the Terms and Privacy Policy to continue');
      else if (db.users.some(x => x.email.toLowerCase() === email)) m = L('อีเมลนี้มีบัญชีแล้ว ลองเข้าสู่ระบบหรือกดลืมรหัสผ่าน', 'This email already has an account. Log in or reset the password.');
      if (m) { state.authMsg = { kind: 'bad', text: m }; return render(); }
      db.users.push({ id: uid('u'), name, email, password: pass, role: 'member', status: 'active', provider: 'email', verified: false, createdAt: Date.now(), lastLogin: Date.now(), reason: '', marketing: $('#rg-news').checked });
      persist(); state.regPending = email; render();
    },
    twofa() {
      if ($('#tf-code').value.trim() !== '123456') { state.authMsg = { kind: 'bad', text: L('รหัสไม่ถูกต้อง ลองรหัสใหม่จากแอป', 'That code is not right. Try the current code from your app.') }; return render(); }
      session.twoFA = true; store.set('qe_session', session); toast(L('ยืนยันตัวตนแล้ว', 'Verified')); go('admin');
    },
    profile() {
      const u = currentUser(), name = $('#pf-name').value.trim(), lang = $('#pf-lang').value;
      if (!name) return toast(L('ชื่อที่แสดงต้องไม่ว่าง', 'Display name cannot be empty'), 'bad');
      u.name = name; persist(); state.lang = lang; store.set('qe_lang', lang); render(); toast(L('บันทึกโปรไฟล์แล้ว', 'Profile saved'));
    },
    deleteMe() {
      const u = currentUser();
      if ($('#dm-email').value.trim().toLowerCase() !== u.email.toLowerCase()) return toast(L('อีเมลไม่ตรง จึงยังไม่ลบบัญชี', 'The email does not match, so nothing was deleted'), 'bad');
      db.users = db.users.filter(x => x.id !== u.id); db.qrs = db.qrs.filter(q => q.userId !== u.id);
      db.audit.unshift({ at: Date.now(), actor: u.email, action: 'user.self_delete', target: u.email, detail: '' }); persist();
      session = null; store.del('qe_session'); go('home'); toast(L('ลบบัญชีแล้ว', 'Account deleted'));
    },
    ads() {
      const st = clone(db.settings), errs = {};
      st.adsEnabled = $('#ad-enabled').checked; st.hideForMembers = $('#ad-hide').checked;
      st.slots.forEach(s => {
        s.client = $('#sc-' + s.key).value.trim(); s.slot = $('#ss-' + s.key).value.trim(); s.enabled = $('#se-' + s.key).checked;
        if (!/^ca-pub-\d{16}$/.test(s.client)) errs['client-' + s.key] = L('รูปแบบ ca-pub- ตามด้วยตัวเลข 16 หลัก', 'Use ca-pub- followed by 16 digits');
        if (!/^\d{6,}$/.test(s.slot)) errs['slot-' + s.key] = L('เป็นตัวเลขอย่างน้อย 6 หลัก', 'Use at least 6 digits');
      });
      st.gaEnabled = $('#ga-enabled').checked; st.gaId = $('#ga-id').value.trim().toUpperCase();
      if (!/^G-[A-Z0-9]{4,}$/.test(st.gaId)) errs.gaId = L('รูปแบบ G- ตามด้วยตัวอักษรหรือตัวเลข', 'Use G- followed by letters or digits');
      st.adsTxt = $('#ads-txt').value;
      const bad = st.adsTxt.split('\n').map(l => l.trim()).filter(l => l && l[0] !== '#').find(l => l.split(',').length < 3);
      if (bad) errs.adsTxt = L('บรรทัดนี้ต้องมีอย่างน้อย 3 ช่องคั่นด้วยจุลภาค: ', 'Each line needs at least 3 comma-separated fields: ') + bad;
      state.adsErrors = errs;
      if (Object.keys(errs).length) { state.adsDraft = st; render(); return toast(L('ยังบันทึกไม่ได้ แก้ช่องที่มีข้อความสีแดงก่อน', 'Not saved yet. Fix the fields marked in red.'), 'bad'); }
      const changes = [];
      if (st.adsEnabled !== db.settings.adsEnabled) changes.push('ads ' + (st.adsEnabled ? 'on' : 'off'));
      if (st.hideForMembers !== db.settings.hideForMembers) changes.push('hide_for_members ' + st.hideForMembers);
      st.slots.forEach((s, i) => { const o = db.settings.slots[i]; if (s.enabled !== o.enabled || s.client !== o.client || s.slot !== o.slot) changes.push(s.key + (s.enabled ? ' on' : ' off')); });
      if (st.gaEnabled !== db.settings.gaEnabled || st.gaId !== db.settings.gaId) changes.push('ga ' + (st.gaEnabled ? st.gaId : 'off'));
      if (st.adsTxt !== db.settings.adsTxt) changes.push('ads.txt');
      db.settings = st; state.adsDraft = null; persist();
      if (changes.length) audit('settings.update', 'ads/ga', changes.join(', '));
      render(); toast(changes.length ? L('บันทึกแล้ว', 'Saved') : L('ไม่มีอะไรเปลี่ยน', 'Nothing changed'));
    }
  };
  document.addEventListener('submit', e => { e.preventDefault(); const f = forms[e.target.dataset.form]; if (f) f(); });

  render();
})();
</script>
