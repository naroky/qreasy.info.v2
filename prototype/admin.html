<title>QREASY CMS Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar; CMS = tab rail | content (rail stacks above content on phones); auth screens = one centered card */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f3f5f9;
  --line: #d5dbe9;
  --fg: #101a30;
  --muted: #55607b;
  --accent: #2741cc;
  --accent-ink: #ffffff;
  --accent-soft: #e2e7fc;
  --ok: #1b6f45;
  --ok-soft: #dcf1e5;
  --warn: #8f5300;
  --warn-soft: #fbeed6;
  --bad: #ab2238;
  --bad-soft: #fbe1e6;
  --shadow: 0 1px 2px rgba(16, 26, 48, 0.06), 0 8px 24px rgba(16, 26, 48, 0.06);
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1220; --surface: #141a2c; --surface-2: #1a2238; --line: #2a3452; --fg: #e6eaf5; --muted: #98a3c2;
    --accent: #8d9fff; --accent-ink: #0d1220; --accent-soft: #222b52;
    --ok: #63d39b; --ok-soft: #12301f; --warn: #f0b45a; --warn-soft: #33260f; --bad: #ff8a9b; --bad-soft: #3a1820;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1220; --surface: #141a2c; --surface-2: #1a2238; --line: #2a3452; --fg: #e6eaf5; --muted: #98a3c2;
  --accent: #8d9fff; --accent-ink: #0d1220; --accent-soft: #222b52;
  --ok: #63d39b; --ok-soft: #12301f; --warn: #f0b45a; --warn-soft: #33260f; --bad: #ff8a9b; --bad-soft: #3a1820;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); font-weight: 700; }
h2 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
.mono { font-family: var(--f-mono); }
.small { font-size: 0.82rem; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.proto { background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); }
.proto-in { max-width: 1320px; margin: 0 auto; padding-block: 6px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
.proto b { color: var(--fg); font-family: var(--f-mono); font-weight: 500; letter-spacing: 0.06em; }
.proto code { font-family: var(--f-mono); color: var(--fg); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.glyph { width: 20px; height: 20px; border: 3px solid var(--fg); border-radius: 3px; position: relative; flex: none; }
.glyph::after { content: ""; position: absolute; inset: 3px; background: var(--accent); border-radius: 1px; }
.brand-t { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.04em; }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; min-width: 0; }
.who span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 24ch; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; transition: border-color 0.15s; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn-danger-solid { background: var(--bad); border-color: var(--bad); color: #ffffff; }
.btn.sm { padding: 5px 11px; font-size: 0.86rem; }
.btn-text { background: none; border: 0; font: inherit; color: var(--muted); cursor: pointer; padding: 6px 8px; border-radius: 6px; }
.btn-text:hover { color: var(--fg); background: var(--surface-2); }
.link-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; }

label { font-weight: 500; font-size: 0.88rem; }
input[type="text"], input[type="url"], input[type="email"], input:not([type]), select, textarea {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px;
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 400; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.err { color: var(--bad); font-size: 0.82rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > input, .row > select { flex: 1 1 180px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.alert { border-radius: 8px; padding: 9px 12px; font-size: 0.88rem; border-left: 3px solid; }
.alert.info { background: var(--accent-soft); color: var(--accent); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert.ok { background: var(--ok-soft); color: var(--ok); }
.pill { display: inline-block; font-size: 0.74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

/* auth screens */
.auth-wrap { min-height: 70vh; display: grid; place-items: center; padding-block: 40px; }
.auth { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
.google { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 11px 16px; font: inherit; font-weight: 600; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); cursor: pointer; }
.google:hover { border-color: var(--accent); }
.g-mark { width: 20px; height: 20px; border-radius: 50%; background: conic-gradient(#ea4335 0 25%, #fbbc05 0 50%, #34a853 0 75%, #4285f4 0); position: relative; flex: none; }
.g-mark::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--surface); }
.picker { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.picker button { display: flex; width: 100%; text-align: left; gap: 12px; align-items: center; padding: 11px 14px; border: 0; border-top: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; cursor: pointer; }
.picker button:first-child { border-top: 0; }
.picker button:hover { background: var(--surface-2); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; flex: none; }
.code-input { font-family: var(--f-mono) !important; font-size: 1.5rem !important; letter-spacing: 0.4em; text-align: center; }
.qr-box { display: grid; place-items: center; padding: 12px; background: #ffffff; border: 1px solid var(--line); border-radius: 10px; }
.qr-box > div { width: 180px; }
.qr-box svg { display: block; width: 100%; height: auto; }
.secret { font-family: var(--f-mono); font-size: 0.95rem; letter-spacing: 0.08em; background: var(--surface-2); padding: 8px 10px; border-radius: 6px; word-break: break-all; }
.codes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-family: var(--f-mono); font-size: 0.95rem; background: var(--surface-2); padding: 12px 14px; border-radius: 8px; }

/* shell */
.shell { max-width: 1320px; margin: 0 auto; padding-block: 22px 56px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.side { flex: 1 1 190px; max-width: 220px; display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 760px) { .side { max-width: none; flex-direction: row; overflow-x: auto; } }
.side a { white-space: nowrap; text-decoration: none; color: var(--muted); padding: 8px 12px; border-radius: 8px; font-weight: 500; }
.side a:hover { background: var(--surface); color: var(--fg); }
.side a.on { background: var(--fg); color: var(--bg); }
.main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.page-head > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.filters .field { flex: 1 1 170px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.open > td { background: var(--accent-soft); }
tr.detail > td { background: var(--surface-2); padding: 16px; }
.detail-grid { display: flex; flex-wrap: wrap; gap: 20px; }
.detail-grid > * { flex: 1 1 280px; min-width: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 0.88rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.act { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.act:last-child { border-bottom: 0; padding-bottom: 0; }
.switch { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; cursor: pointer; }
.switch input { width: 40px; height: 22px; appearance: none; background: var(--line); border-radius: 999px; position: relative; cursor: pointer; transition: background 0.15s; flex: none; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform 0.15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }
.types-check { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.foot-note { font-size: 0.8rem; color: var(--muted); }
.toasts { position: fixed; z-index: 30; top: calc(env(safe-area-inset-top, 0px) + 70px); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 24px)); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; box-shadow: var(--shadow); animation: tin 0.2s ease-out; }
.toast.bad { background: var(--bad); color: #ffffff; }
@keyframes tin { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>

<div class="proto gutter" id="proto"></div>
<header class="top gutter" id="top"></header>
<main class="gutter" id="app"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- storage (prototype only: lives in this browser) ---------- */
  const mem = {};
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); if (v !== null) return JSON.parse(v); } catch (e) {} return k in mem ? mem[k] : d; },
    set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
  };
  const DAY = 864e5, NOW = Date.now();
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clone = o => JSON.parse(JSON.stringify(o));
  const rid = n => Array.from({ length: n }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
  const fmtDate = (t, time) => { try { return new Intl.DateTimeFormat('th-TH', time ? { dateStyle: 'medium', timeStyle: 'short' } : { dateStyle: 'medium' }).format(new Date(t)); } catch (e) { return new Date(t).toLocaleString(); } };
  const rank = { member: 0, admin: 1, super_admin: 2 };
  const roleLabel = r => ({ member: 'สมาชิก', admin: 'Admin', super_admin: 'Super Admin' }[r] || r);
  const TYPES = [['url', 'ลิงก์'], ['text', 'ข้อความ'], ['wifi', 'Wi-Fi'], ['email', 'อีเมล'], ['phone', 'เบอร์โทร'], ['sms', 'SMS'], ['vcard', 'นามบัตร'], ['any', 'ทุกประเภท']];
  const typeLabel = t => (TYPES.find(x => x[0] === t) || [t, t])[1];
  const ALLOWED_HOSTS = ['shopee.co.th', 's.shopee.co.th', 'lazada.co.th', 'www.lazada.co.th', 's.lazada.co.th', 'invol.co', 'atth.me'];

  function seed() {
    const u = (id, name, email, role, created, last, extra) => Object.assign({ id, name, email, role, status: 'active', createdAt: NOW - created * DAY, lastLogin: NOW - last * DAY, reason: '', qrs: 0, mfa: null }, extra || {});
    return {
      version: 1,
      users: [
        u('u1', 'เจ้าของเว็บไซต์', 'admin@qreasy.info', 'super_admin', 180, 0, { mfa: { enrolledAt: NOW - 170 * DAY, recovery: ['AAAA-1111', 'BBBB-2222', 'CCCC-3333', 'DDDD-4444', 'EEEE-5555', 'FFFF-6666', 'GGGG-7777', 'HHHH-8888', 'JJJJ-9999', 'KKKK-0000'] } }),
        u('u2', 'Ops Admin', 'ops.admin@example.com', 'admin', 30, 2),
        u('u3', 'Demo Member', 'demo@qreasy.info', 'member', 40, 2, { qrs: 2 }),
        u('u4', 'ร้านกาแฟบ้านสวน', 'cafe.baansuan@example.com', 'member', 3, 0, { qrs: 5 }),
        u('u5', 'Narin P.', 'narin.p@example.com', 'member', 6, 1, { qrs: 1 }),
        u('u6', 'ครูแพร', 'kru.prae@example.com', 'member', 12, 4, { qrs: 9 }),
        u('u7', 'Studio Ink', 'hello@studioink.example', 'member', 25, 9, { qrs: 14 }),
        u('u8', 'Somsak T.', 'somsak.t@example.com', 'member', 50, 20, { status: 'suspended', reason: 'สร้าง QR ไปยังลิงก์หลอกลวงซ้ำหลายครั้ง', qrs: 3 }),
        u('u9', 'Mali K.', 'mali.k@example.com', 'member', 1, 0),
        u('u10', 'Kittipong S.', 'kittipong.s@example.com', 'member', 75, 33, { qrs: 4 }),
        u('u11', 'Ploy R.', 'ploy.r@example.com', 'member', 9, 9, { qrs: 2 })
      ],
      settings: {
        adsEnabled: false, hideForMembers: false, gaEnabled: true, gaId: 'G-QREASY2026', adsTxt: '', maxSaved: 100,
        weights: { adsense: 100, ezoic: 0 },
        slots: [
          { key: 'generator_side', size: '300×600', client: '', slot: '', enabled: true },
          { key: 'generator_below', size: '320×100 / Responsive', client: '', slot: '', enabled: true },
          { key: 'mobile_anchor', size: '320×50', client: '', slot: '', enabled: false },
          { key: 'article_inline', size: 'Responsive', client: '', slot: '', enabled: true }
        ]
      },
      affiliates: [
        { id: 'a1', nameTh: 'ป้ายตั้งโต๊ะอะคริลิก A6 ใส่ QR Code', nameEn: 'A6 acrylic QR table stand', platform: 'Shopee', price: '฿59–150', types: ['url', 'wifi', 'any'], url: 'https://shopee.co.th/search?keyword=%E0%B8%9B%E0%B9%89%E0%B8%B2%E0%B8%A2%E0%B8%AD%E0%B8%B0%E0%B8%84%E0%B8%A3%E0%B8%B4%E0%B8%A5%E0%B8%B4%E0%B8%81', enabled: true, sort: 1, clicks: 14 },
        { id: 'a2', nameTh: 'สติกเกอร์ PVC กันน้ำ สั่งพิมพ์ QR', nameEn: 'Waterproof PVC QR stickers', platform: 'Lazada', price: '฿120–350', types: ['url', 'text'], url: 'https://www.lazada.co.th/catalog/?q=qr+sticker', enabled: true, sort: 2, clicks: 9 },
        { id: 'a3', nameTh: 'นามบัตร NFC', nameEn: 'NFC business card', platform: 'Shopee', price: '฿150–490', types: ['vcard', 'phone', 'email'], url: 'https://shopee.co.th/search?keyword=nfc+card', enabled: true, sort: 3, clicks: 5 },
        { id: 'a4', nameTh: 'กระดาษสติกเกอร์สำหรับเครื่องพิมพ์', nameEn: 'Printable sticker paper', platform: 'Lazada', price: '฿99–220', types: ['any'], url: 'https://www.lazada.co.th/catalog/?q=sticker+paper', enabled: false, sort: 4, clicks: 0 }
      ],
      audit: [
        { at: NOW - 20 * DAY, actor: 'admin@qreasy.info', action: 'user.suspend', target: 'somsak.t@example.com', detail: 'สร้าง QR ไปยังลิงก์หลอกลวงซ้ำหลายครั้ง' },
        { at: NOW - 30 * DAY, actor: 'admin@qreasy.info', action: 'user.role', target: 'ops.admin@example.com', detail: 'member → admin' },
        { at: NOW - 31 * DAY, actor: 'admin@qreasy.info', action: 'settings.update', target: 'ads/ga', detail: 'ga G-QREASY2026' }
      ]
    };
  }
  let db = store.get('qa_db', null);
  if (!db || db.version !== 1) { db = seed(); store.set('qa_db', db); }
  const persist = () => store.set('qa_db', db);
  let session = store.get('qa_session', null);

  const state = {
    theme: store.get('qa_theme', 'system'),
    pickerOpen: false, authMsg: null, mfaFails: 0, mfaLockUntil: 0, useRecovery: false,
    enroll: null,
    q: '', fStatus: 'all', fRole: 'all', openUser: null,
    adsErr: {}, adsDraft: null,
    affEdit: null, affErr: {}, affConfirm: null,
    auActor: 'all', auAction: '',
    resetArmed: false
  };

  /* ---------- helpers ---------- */
  function me() {
    if (!session) return null;
    const u = db.users.find(x => x.id === session.uid);
    if (!u || u.status !== 'active') { session = null; store.del('qa_session'); return null; }
    return u;
  }
  const isAdmin = u => u && rank[u.role] >= 1;
  function route() { return location.hash.replace(/^#/, '') || 'overview'; }
  function go(h) { if (route() === h) render(); else location.hash = h; }
  function toast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'toast' + (kind === 'bad' ? ' bad' : '');
    el.textContent = msg; $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), 3800);
  }
  function audit(action, target, detail) {
    const u = me();
    db.audit.unshift({ at: Date.now(), actor: u ? u.email : '-', action, target, detail: detail || '' });
    db.audit = db.audit.slice(0, 300); persist();

    const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');

      try { await dl.save({ filename: name, data: blob }); return true; }
      catch (err) { if (!err || err.code !== 'declined') toast('บันทึกไฟล์ไม่สำเร็จ', 'bad'); return false; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    return true;
  }

    return '<div class="tbl-wrap"><table><thead><tr><th>เวลา</th><th>ผู้ทำ</th><th>การกระทำ</th><th>เป้าหมาย</th><th>รายละเอียด</th></tr></thead><tbody>' +

  /* ---------- render ---------- */
  let lastRoute = null;
  function render() {
    applyTheme(); renderProto(); renderTop();
    const u = me(), r = route();
    let html;
    if (!u) html = viewLogin();
    else if (!isAdmin(u)) html = viewDenied();
    else if (!u.mfa) { if (!state.enroll) state.enroll = { step: 1, secret: rid(32), codes: [] }; html = viewEnroll(); }
    else if (!session.mfa) html = viewVerify();
    else {
      const map = { overview: viewOverview, users: viewUsers, ads: viewAds, affiliate: viewAff, audit: viewAudit };
      html = shell(map[r] ? r : 'overview', (map[r] || viewOverview)());
    }
    $('#app').innerHTML = html;
    if (r !== lastRoute) { window.scrollTo(0, 0); lastRoute = r; }
    const qr = $('#totp-qr');
    if (qr && typeof window.QRCodeStyling === 'function') {
      const uri = 'otpauth://totp/' + encodeURIComponent('QREASY CMS:' + u.email) + '?secret=' + state.enroll.secret + '&issuer=' + encodeURIComponent('QREASY CMS');
      try { new window.QRCodeStyling({ width: 180, height: 180, type: 'svg', data: uri, margin: 4, qrOptions: { errorCorrectionLevel: 'M' }, dotsOptions: { color: '#101a30', type: 'square' }, backgroundOptions: { color: '#ffffff' } }).append(qr); } catch (e) {}
    }
  }
  window.addEventListener('hashchange', render);

  function signIn(u) {
    session = { uid: u.id, mfa: false, at: Date.now() }; store.set('qa_session', session);
    u.lastLogin = Date.now(); persist();
    state.pickerOpen = false; state.useRecovery = false; state.mfaFails = 0;
    if (!isAdmin(u)) { render(); return; }
    render();
  }
  function passMfa(method) {
    session.mfa = true; store.set('qa_session', session);
    audit('auth.cms_login', me().email, method);
    toast('ยืนยันตัวตนแล้ว'); go('overview');
  }
  function mfaFail(text) {
    state.mfaFails++;
    if (state.mfaFails >= 5) { state.mfaLockUntil = Date.now() + 15 * 60000; state.mfaFails = 0; }
    state.authMsg = { kind: 'bad', text }; render();
  }

  /* ---------- actions ---------- */
  const find = id => db.users.find(x => x.id === id);
  const refreshUsers = () => { const t = $('#userTable'); if (t) t.innerHTML = userTable(); };
  const actions = {
    theme() { state.theme = { system: 'light', light: 'dark', dark: 'system' }[state.theme]; store.set('qa_theme', state.theme); render(); },
    reset() {
      if (!state.resetArmed) { state.resetArmed = true; renderProto(); setTimeout(() => { state.resetArmed = false; renderProto(); }, 4000); return; }
      state.resetArmed = false; db = seed(); persist(); session = null; store.del('qa_session'); state.enroll = null; go('overview'); toast('รีเซ็ตข้อมูลตัวอย่างแล้ว');
    },
    google() { state.pickerOpen = !state.pickerOpen; render(); },
    pick(b) { const u = find(b.dataset.id); if (!u) return; if (u.status !== 'active') { state.authMsg = { kind: 'bad', text: 'บัญชีนี้ถูกระงับ' }; state.pickerOpen = false; return render(); } signIn(u); },
    logout() { session = null; store.del('qa_session'); state.enroll = null; state.pickerOpen = false; go('overview'); },
    toggleRecovery() { state.useRecovery = !state.useRecovery; render(); },
    copyCodes() {
      const t = state.enroll.codes.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('คัดลอกรหัสกู้คืนแล้ว'), () => toast('คัดลอกไม่ได้ ให้เลือกข้อความแล้วคัดลอกเอง', 'bad'));
      else toast('คัดลอกไม่ได้ ให้เลือกข้อความแล้วคัดลอกเอง', 'bad');
    },
    dlCodes() { saveFile('qreasy-cms-recovery-codes.txt', 'QREASY CMS recovery codes for ' + me().email + '\n\n' + state.enroll.codes.join('\n') + '\n').then(ok => { if (ok) toast('ดาวน์โหลดรหัสกู้คืนแล้ว'); }); },
    finishEnroll() {
      if (!$('#saved-codes').checked) return toast('ติ๊กยืนยันว่าเก็บรหัสกู้คืนแล้วก่อน', 'bad');
      const u = me(); u.mfa = { enrolledAt: Date.now(), recovery: state.enroll.codes.slice() }; persist();
      audit('auth.mfa_enroll', u.email, 'TOTP'); state.enroll = null; passMfa('mfa_enroll');
    },
    openUser(b) { state.openUser = state.openUser === b.dataset.id ? null : b.dataset.id; refreshUsers(); },
    suspend(b) {
      const u = find(b.dataset.id), reason = $('#rs-' + u.id).value.trim();
      if (!reason) { $('#rs-err-' + u.id).textContent = 'ระบุเหตุผลก่อนระงับ'; return; }
      u.status = 'suspended'; u.reason = reason; persist(); audit('user.suspend', u.email, reason); refreshUsers();
      toast('ระงับบัญชีและ Logout ทุกอุปกรณ์แล้ว');
    },
    unsuspend(b) { const u = find(b.dataset.id); u.status = 'active'; u.reason = ''; persist(); audit('user.unsuspend', u.email); refreshUsers(); toast('ยกเลิกการระงับแล้ว'); },
    revoke(b) { const u = find(b.dataset.id); audit('user.revoke_sessions', u.email); toast('Logout ' + u.email + ' จากทุกอุปกรณ์แล้ว'); },
    resetMfa(b) { const u = find(b.dataset.id); u.mfa = null; persist(); audit('user.reset_mfa', u.email); refreshUsers(); toast('รีเซ็ต 2FA แล้ว ผู้ใช้ต้องลงทะเบียนใหม่ตอนเข้า CMS ครั้งถัดไป'); },
    setRole(b) {
      const a = me(), u = find(b.dataset.id), v = $('#rl-' + u.id).value;
      if (a.role !== 'super_admin' || v === u.role) return;
      const before = u.role; u.role = v; if (v === 'member') u.mfa = null; persist();
      audit('user.role', u.email, before + ' → ' + v); refreshUsers(); toast('เปลี่ยนบทบาทแล้ว');
    },
    delete(b) {
      const u = find(b.dataset.id);
      if ($('#dl-' + u.id).value.trim().toLowerCase() !== u.email.toLowerCase()) { $('#dl-err-' + u.id).textContent = 'อีเมลไม่ตรง จึงยังไม่ลบ'; return; }
      db.users = db.users.filter(x => x.id !== u.id); state.openUser = null; persist(); audit('user.delete', u.email, 'ลบโดยผู้ดูแล'); refreshUsers(); toast('ลบบัญชีแล้ว');
    },
    exportCsv() {
      const list = filteredUsers(), q = v => '"' + String(v).replace(/"/g, '""') + '"';
      const csv = '﻿' + ['id,name,email,role,status,created_at,last_login_at'].concat(list.map(u => [u.id, u.name, u.email, u.role, u.status, new Date(u.createdAt).toISOString(), new Date(u.lastLogin).toISOString()].map(q).join(','))).join('\n');
      const d = new Date(), p = n => String(n).padStart(2, '0');
      saveFile('qreasy-users-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.csv', csv).then(ok => {
        if (ok) { audit('users.export_csv', 'ผู้ใช้ ' + list.length + ' รายการ', 'สถานะ=' + state.fStatus + ', บทบาท=' + state.fRole + (state.q ? ', ค้นหา=' + state.q : '')); toast('ส่งออก ' + list.length + ' รายการแล้ว'); }
      });
    },
    affNew() { state.affEdit = 'new'; state.affErr = {}; render(); },
    affEdit(b) { state.affEdit = b.dataset.id; state.affErr = {}; render(); },
    affClose() { state.affEdit = null; state.affErr = {}; render(); },
    affAskDel(b) { state.affConfirm = b.dataset.id; render(); },
    affCancelDel() { state.affConfirm = null; render(); },
    affDelete(b) { const a = db.affiliates.find(x => x.id === b.dataset.id); db.affiliates = db.affiliates.filter(x => x.id !== a.id); state.affConfirm = null; persist(); audit('affiliate.delete', a.nameTh); render(); toast('ลบสินค้าแล้ว'); }
  };
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.act]; if (!fn) return;
    e.preventDefault(); fn(el, e);
  });
  function onFilter(e) {
    const el = e.target;
    if (el.dataset.uf) { state[el.dataset.uf] = el.value; refreshUsers(); return; }
    if (el.dataset.af && e.type === 'change') { state[el.dataset.af] = el.value; render(); return; }
    if (el.dataset.affToggle && e.type === 'change') {
      const a = db.affiliates.find(x => x.id === el.dataset.affToggle); a.enabled = el.checked; persist();
      audit('affiliate.toggle', a.nameTh, a.enabled ? 'แสดง' : 'ซ่อน'); toast(a.enabled ? 'แสดงสินค้าแล้ว' : 'ซ่อนสินค้าแล้ว');
    }
  }
  document.addEventListener('input', onFilter);
  document.addEventListener('change', e => { if (e.target.dataset.uf && e.target.tagName === 'INPUT') return; onFilter(e); });

  const forms = {
    enroll() {
      if ($('#en-code').value.trim() !== '123456') { state.authMsg = { kind: 'bad', text: 'รหัสไม่ถูกต้อง ตรวจว่าเวลาในมือถือตรงกับเวลาจริง แล้วกรอกรหัสล่าสุดจากแอป' }; return render(); }
      state.enroll.step = 2; state.enroll.codes = Array.from({ length: 10 }, () => rid(4) + '-' + rid(4)); render();
    },
    verify() {
      if (state.mfaLockUntil > Date.now()) return render();
      if ($('#vf').value.trim() !== '123456') return mfaFail('รหัสไม่ถูกต้อง ลองรหัสล่าสุดจากแอป');
      passMfa('totp');
    },
    recovery() {
      if (state.mfaLockUntil > Date.now()) return render();
      const u = me(), v = $('#rc').value.trim().toUpperCase(), i = u.mfa.recovery.indexOf(v);
      if (i < 0) return mfaFail('รหัสกู้คืนไม่ถูกต้อง หรือถูกใช้ไปแล้ว');
      u.mfa.recovery.splice(i, 1); persist(); audit('auth.recovery_code', u.email, 'เหลือ ' + u.mfa.recovery.length + ' ชุด');
      toast('ใช้รหัสกู้คืนแล้ว เหลือ ' + u.mfa.recovery.length + ' ชุด'); passMfa('recovery');
    },
    ads() {
      const st = clone(db.settings), errs = {};
      st.adsEnabled = $('#ad-on').checked; st.hideForMembers = $('#ad-hide').checked;
      st.slots.forEach(s => {
        s.client = $('#sc-' + s.key).value.trim(); s.slot = $('#ss-' + s.key).value.trim(); s.enabled = $('#se-' + s.key).checked;
        if (st.adsEnabled && s.enabled) {
          if (!/^ca-pub-\d{16}$/.test(s.client)) errs['c-' + s.key] = 'ใช้รูปแบบ ca-pub- ตามด้วยตัวเลข 16 หลัก';
          if (!/^\d{6,}$/.test(s.slot)) errs['s-' + s.key] = 'ตัวเลขอย่างน้อย 6 หลัก';
        }
      });
      const wa = Number($('#w-ad').value), we = Number($('#w-ez').value);
      if (!Number.isInteger(wa) || !Number.isInteger(we) || wa < 0 || we < 0 || wa + we !== 100) errs.w = 'สัดส่วนต้องเป็นจำนวนเต็มและรวมกันได้ 100%';
      st.weights = { adsense: wa, ezoic: we };
      st.gaEnabled = $('#ga-on').checked; st.gaId = $('#ga-id').value.trim().toUpperCase();
      if (st.gaEnabled && !/^G-[A-Z0-9]{4,}$/.test(st.gaId)) errs.ga = 'ใช้รูปแบบ G- ตามด้วยตัวอักษรหรือตัวเลข';
      st.adsTxt = $('#ads-txt').value;
      const bad = st.adsTxt.split('\n').map(l => l.trim()).filter(l => l && l[0] !== '#').find(l => l.split(',').length < 3);
      if (bad) errs.txt = 'บรรทัดนี้ต้องมีอย่างน้อย 3 ช่องคั่นด้วยจุลภาค: ' + bad;
      if (st.adsEnabled && !st.adsTxt.trim()) errs.txt = 'ใส่ ads.txt ก่อนเปิดโฆษณา';
      st.maxSaved = Number($('#max-qr').value);
      if (!Number.isInteger(st.maxSaved) || st.maxSaved < 1 || st.maxSaved > 1000) errs.max = 'ใส่จำนวนเต็ม 1–1,000';
      state.adsErr = errs;
      if (Object.keys(errs).length) { state.adsDraft = st; render(); return toast('ยังบันทึกไม่ได้ แก้ช่องที่มีข้อความสีแดงก่อน', 'bad'); }
      const o = db.settings, ch = [];
      if (st.adsEnabled !== o.adsEnabled) ch.push('ads ' + (st.adsEnabled ? 'on' : 'off'));
      if (st.hideForMembers !== o.hideForMembers) ch.push('hide_for_members ' + st.hideForMembers);
      st.slots.forEach((s, i) => { const p = o.slots[i]; if (s.enabled !== p.enabled || s.client !== p.client || s.slot !== p.slot) ch.push(s.key + (s.enabled ? ' on' : ' off')); });
      if (wa !== o.weights.adsense) ch.push('ab adsense ' + wa + '% / ezoic ' + we + '%');
      if (st.gaEnabled !== o.gaEnabled || st.gaId !== o.gaId) ch.push('ga ' + (st.gaEnabled ? st.gaId : 'off'));
      if (st.adsTxt !== o.adsTxt) ch.push('ads.txt');
      if (st.maxSaved !== o.maxSaved) ch.push('max_saved_qr ' + st.maxSaved);
      db.settings = st; state.adsDraft = null; persist();
      if (ch.length) audit('settings.update', 'ads/ga', ch.join(', '));
      render(); toast(ch.length ? 'บันทึกแล้ว' : 'ไม่มีอะไรเปลี่ยน');
    },
    aff() {
      const errs = {}, isNew = state.affEdit === 'new';
      const v = { nameTh: $('#af-th').value.trim(), nameEn: $('#af-en').value.trim(), platform: $('#af-pf').value, price: $('#af-pr').value.trim(), url: $('#af-url').value.trim(), sort: Number($('#af-sort').value), types: Array.from(document.querySelectorAll('input[name="af-type"]:checked')).map(x => x.value) };
      if (!v.nameTh) errs.th = 'กรอกชื่อสินค้า';
      let host = '';
      try { const u = new URL(v.url); if (u.protocol !== 'https:') throw 0; host = u.hostname.toLowerCase(); } catch (e) { errs.url = 'ลิงก์ต้องขึ้นต้นด้วย https://'; }
      if (host && ALLOWED_HOSTS.indexOf(host) < 0) errs.url = 'โดเมน ' + host + ' ไม่อยู่ในรายการที่อนุญาต';
      if (!v.types.length) errs.types = 'เลือกอย่างน้อย 1 ประเภท';
      if (!Number.isInteger(v.sort) || v.sort < 1) errs.sort = 'ใส่จำนวนเต็มตั้งแต่ 1';
      state.affErr = errs;
      if (Object.keys(errs).length) { render(); return toast('ยังบันทึกไม่ได้ แก้ช่องที่มีข้อความสีแดงก่อน', 'bad'); }
      if (isNew) { db.affiliates.push(Object.assign({ id: 'a' + Date.now(), enabled: true, clicks: 0 }, v)); audit('affiliate.create', v.nameTh, v.platform); }
      else { Object.assign(db.affiliates.find(x => x.id === state.affEdit), v); audit('affiliate.update', v.nameTh, v.platform); }
      persist(); state.affEdit = null; render(); toast('บันทึกสินค้าแล้ว');
    }
  };
  document.addEventListener('submit', e => { e.preventDefault(); const f = forms[e.target.dataset.form]; if (f) f(); });

  render();
})();
</script>
