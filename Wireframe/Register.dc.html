<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สมัครสมาชิก มือถือ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2741cc}a:hover{color:#1a2f9e}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f6f7f9; color: #1d2330; font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif; font-size: 15px; line-height: 1.6; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px">
    <a href="Mobile.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1d2330">
      <span aria-hidden="true" style="width: 18px; height: 18px; border: 3px solid #1d2330; border-radius: 3px; box-sizing: border-box; display: block"></span>
      <span style="font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.04em">QREASY<span style="color: #2741cc">.INFO</span></span>
    </a>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 16px 24px 20px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 30px">สมัครสมาชิกฟรี</h1>
      <p style="margin: 0; color: #5b6478; font-size: 14px">เก็บ QR Code ไว้เปิดและแก้ไขภายหลัง ทุกฟีเจอร์ฟรี</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="font: inherit; font-weight: 500; color: #1d2330; background: #ffffff; border: 1.5px solid #c9ced8; border-radius: 10px; padding: 11px 12px">สมัครด้วย Google</button>
      <button style="font: inherit; font-weight: 500; color: #1d2330; background: #ffffff; border: 1.5px solid #c9ced8; border-radius: 10px; padding: 11px 12px">สมัครด้วย LINE</button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #5b6478">
      <span style="flex-grow: 1; height: 1px; background: #dde1e8"></span>หรือใช้อีเมล<span style="flex-grow: 1; height: 1px; background: #dde1e8"></span>
    </div>

    <form style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="rg-name" style="font-size: 14px; font-weight: 500">ชื่อที่แสดง *</label>
        <input id="rg-name" style="font: inherit; padding: 10px 14px; border: 1.5px solid #c9ced8; border-radius: 10px; background: #ffffff; color: #1d2330">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="rg-email" style="font-size: 14px; font-weight: 500">อีเมล *</label>
        <input id="rg-email" type="email" style="font: inherit; padding: 10px 14px; border: 1.5px solid #c9ced8; border-radius: 10px; background: #ffffff; color: #1d2330">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="rg-pass" style="font-size: 14px; font-weight: 500">รหัสผ่าน (อย่างน้อย 8 ตัวอักษร) *</label>
        <input id="rg-pass" type="password" style="font: inherit; padding: 10px 14px; border: 1.5px solid #c9ced8; border-radius: 10px; background: #ffffff; color: #1d2330">
      </div>
      <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin-top: 3px; flex-shrink: 0"> <span>ฉันยอมรับ <a href="#terms">ข้อกำหนดการใช้งาน</a> และ <a href="#privacy">นโยบายความเป็นส่วนตัว</a></span></label>
      <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 14px; color: #3a4256"><input type="checkbox" style="width: 18px; height: 18px; margin-top: 3px; flex-shrink: 0"> <span>รับอีเมลข่าวสารและเคล็ดลับ (ไม่บังคับ)</span></label>
      <button type="submit" style="font: inherit; font-weight: 600; font-size: 16px; color: #ffffff; background: #2741cc; border: 0; border-radius: 12px; padding: 13px 16px">สมัครสมาชิก</button>
    </form>

    <p style="margin: 0; text-align: center">มีบัญชีแล้ว? <a href="Login.dc.html">เข้าสู่ระบบ</a></p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
