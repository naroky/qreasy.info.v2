<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>บัญชีของฉัน มือถือ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2741cc}a:hover{color:#1a2f9e}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #f6f7f9; color: #1d2330; font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif; font-size: 15px; line-height: 1.6; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px">
    <a href="Mobile.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1d2330">
      <span aria-hidden="true" style="width: 18px; height: 18px; border: 3px solid #1d2330; border-radius: 3px; box-sizing: border-box; display: block"></span>
      <span style="font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.04em">QREASY<span style="color: #2741cc">.INFO</span></span>
    </a>
    <button style="border: 0; background: transparent; font: inherit; color: #3a4256; min-height: 44px; padding: 0 8px">ออกจากระบบ</button>
  </header>

  <nav aria-label="บัญชี" style="display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid #dde1e8">
    <a href="MyQr.dc.html" style="text-decoration: none; color: #5b6478; padding: 10px 12px">QR ของฉัน</a>
    <a href="#account" aria-current="page" style="text-decoration: none; color: #1d2330; font-weight: 600; padding: 10px 12px; border-bottom: 2px solid #1d2330">บัญชี</a>
  </nav>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px">
    <form style="background: #ffffff; border: 1.5px solid #dde1e8; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: 'Bai Jamjuree', sans-serif; font-weight: 600; font-size: 17px">โปรไฟล์</h2>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="pf-name" style="font-size: 14px; font-weight: 500">ชื่อที่แสดง</label>
        <input id="pf-name" value="[ชื่อสมาชิก]" style="font: inherit; padding: 10px 14px; border: 1.5px solid #c9ced8; border-radius: 10px; background: #ffffff; color: #1d2330">
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="pf-lang" style="font-size: 14px; font-weight: 500">ภาษา</label>
          <select id="pf-lang" style="font: inherit; padding: 10px; border: 1.5px solid #c9ced8; border-radius: 10px; background: #ffffff; color: #1d2330"><option>ไทย</option></select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 14px; font-weight: 500">รหัสผ่าน</span>
          <button type="button" style="font: inherit; padding: 9px 10px; border: 1.5px solid #c9ced8; border-radius: 10px; background: #ffffff; color: #1d2330">เปลี่ยน</button>
        </div>
      </div>
      <p style="margin: 0; font-size: 13px; color: #5b6478">สมัครด้วย Google · [วันที่สมัคร]</p>
      <button type="submit" style="align-self: flex-start; font: inherit; font-weight: 600; color: #ffffff; background: #2741cc; border: 0; border-radius: 10px; padding: 10px 18px">บันทึกโปรไฟล์</button>
    </form>

    <section style="background: #ffffff; border: 1.5px solid #dde1e8; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-family: 'Bai Jamjuree', sans-serif; font-weight: 600; font-size: 17px">ข้อมูลของฉัน</h2>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 40px"><input type="checkbox" style="width: 18px; height: 18px"> รับอีเมลข่าวสาร</label>
      <button style="align-self: flex-start; font: inherit; color: #1d2330; background: #ffffff; border: 1.5px solid #c9ced8; border-radius: 10px; padding: 9px 14px">ขอไฟล์ข้อมูลของฉัน (JSON)</button>
      <a href="#cookies" style="font-size: 14px">ตั้งค่าคุกกี้</a>
    </section>

    <section style="border: 1.5px solid #e9b7c1; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-family: 'Bai Jamjuree', sans-serif; font-weight: 600; font-size: 17px; color: #ab2238">ลบบัญชี</h2>
      <p style="margin: 0; font-size: 13px; color: #3a4256">Login ไม่ได้ทันที และข้อมูลจะถูกลบถาวรภายใน 30 วัน พิมพ์อีเมลของคุณเพื่อยืนยัน</p>
      <div style="display: flex; gap: 8px">
        <label for="dm" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">พิมพ์อีเมลเพื่อยืนยัน</label>
        <input id="dm" placeholder="[อีเมลของคุณ]" style="flex-grow: 1; min-width: 0; font: inherit; padding: 9px 12px; border: 1.5px solid #c9ced8; border-radius: 10px; background: #ffffff; color: #1d2330">
        <button style="font: inherit; color: #ab2238; background: #ffffff; border: 1.5px solid #ab2238; border-radius: 10px; padding: 9px 12px">ลบบัญชี</button>
      </div>
    </section>
  </main>
</div>
</x-dc>

</body>
</html>
