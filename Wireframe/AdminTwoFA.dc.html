<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>CMS ยืนยันตัวตนสองชั้น</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2741cc}a:hover{color:#1a2f9e}
</style>
</helmet>
<div style="min-height: 760px; box-sizing: border-box; background: #eef0f4; color: #1d2330; font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif; font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 20px">
  <section style="width: 100%; max-width: 420px; box-sizing: border-box; background: #ffffff; border: 1.5px solid #dde1e8; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 20px; height: 20px; border: 3px solid #1d2330; border-radius: 3px; box-sizing: border-box; display: block"></span>
      <span style="font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.04em">QREASY CMS</span>
    </div>
    <h1 style="margin: 0; font-family: 'Bai Jamjuree', sans-serif; font-weight: 700; font-size: 26px">ยืนยันตัวตนสองชั้น</h1>
    <p style="margin: 0; color: #3a4256">กรอกรหัส 6 หลักจากแอป Authenticator ก่อนเข้า CMS</p>
    <form style="display: flex; flex-direction: column; gap: 12px">
      <label for="tf" style="font-size: 14px; font-weight: 500">รหัส 6 หลัก</label>
      <input id="tf" inputmode="numeric" maxlength="6" placeholder="••••••" style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; letter-spacing: 0.4em; text-align: center; padding: 12px; border: 1.5px solid #c9ced8; border-radius: 10px; background: #ffffff; color: #1d2330">
      <button type="submit" style="font: inherit; font-weight: 600; color: #ffffff; background: #2741cc; border: 0; border-radius: 10px; padding: 12px 16px">ยืนยัน</button>
    </form>
    <a href="#recovery" style="font-size: 14px; text-align: center">ใช้รหัสกู้คืนแทน</a>
    <p style="margin: 0; font-size: 12px; color: #5b6478; text-align: center">Session ของ CMS หมดอายุเมื่อไม่ใช้งาน 30 นาที</p>
  </section>
</div>
</x-dc>

</body>
</html>
